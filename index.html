<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Here We Go 5 - Wordwall 英語學習資源庫</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        sans: ['Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .btn-push {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 0 rgba(0,0,0,0.15);
        }
        .btn-push:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 0 rgba(0,0,0,0.15);
        }
        .modal-blur {
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- 頂部 Header -->
    <header class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white text-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center text-2xl font-black shadow-inner">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-black tracking-wide font-fredoka">Here We Go 5</h1>
                    <p class="text-xs sm:text-sm text-indigo-100 font-medium">Wordwall 互動練習資源庫</p>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
                <button onclick="openModal('addModal')" class="bg-amber-400 hover:bg-amber-300 text-amber-950 font-bold px-4 py-2 rounded-xl text-sm flex items-center gap-2 btn-push transition">
                    <i class="fa-solid fa-plus text-base"></i>
                    <span>新增資源</span>
                </button>
                <button onclick="openModal('backupModal')" class="bg-white/20 hover:bg-white/30 text-white font-bold px-3 py-2 rounded-xl text-sm flex items-center gap-1.5 backdrop-blur-md transition">
                    <i class="fa-solid fa-sliders"></i>
                    <span class="hidden sm:inline">管理與備份</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex-1 w-full">

        <!-- 搜尋與單元篩選區 -->
        <div class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200 mb-6">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-4">
                <!-- 搜尋框 -->
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="filterCards()" placeholder="搜尋練習名稱..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>

                <!-- 統計資訊 -->
                <div class="text-xs sm:text-sm font-semibold text-slate-500 bg-slate-50 px-4 py-2 rounded-xl border border-slate-100 w-full md:w-auto text-center">
                    總計 <span id="totalCount" class="text-indigo-600 font-bold">0</span> 個練習 | 已完成 <span id="completedCount" class="text-emerald-600 font-bold">0</span> 個
                </div>
            </div>

            <!-- 單元頁籤切換區 -->
            <div id="unitTabs" class="flex flex-wrap gap-2 pt-2 border-t border-slate-100">
                <!-- 由 JS 動態生成按鈕 -->
            </div>
        </div>

        <!-- 按單元分類展示區 -->
        <div id="unitSectionsContainer" class="space-y-8">
            <!-- 由 JS 動態生成單元區塊與卡片 -->
        </div>

        <!-- 空資料提示區 -->
        <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm">
            <i class="fa-solid fa-folder-open text-5xl text-slate-300 mb-4"></i>
            <h3 class="text-lg font-bold text-slate-600">找不到相關的練習資源</h3>
            <p class="text-slate-400 text-sm mt-1">請嘗試變更搜尋關鍵字或選擇其他單元頁籤</p>
        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-slate-800 text-slate-400 py-6 text-center text-xs sm:text-sm mt-8 border-t border-slate-700">
        <p>Here We Go 5 Wordwall Practice Hub &copy; 2026</p>
    </footer>

    <!-- Modal: 新增練習資源 -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/60 modal-blur z-50 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-2xl border border-slate-100">
            <div class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-square-plus"></i>
                    <span>新增 Wordwall 資源</span>
                </h3>
                <button onclick="closeModal('addModal')" class="text-indigo-200 hover:text-white text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form onsubmit="handleAddResource(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">所屬單元 *</label>
                    <input type="text" id="addUnit" placeholder="例：U5 或 Unit 5" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">練習標題 *</label>
                    <input type="text" id="addTitle" placeholder="例：聽音選字" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Wordwall 網址 *</label>
                    <input type="url" id="addUrl" placeholder="https://wordwall.net/tc/resource/..." required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>
                <div class="pt-2 flex justify-end gap-3">
                    <button type="button" onclick="closeModal('addModal')" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 font-semibold text-sm hover:bg-slate-50">取消</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 shadow-md">儲存新增</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: 管理與備份選單 -->
    <div id="backupModal" class="fixed inset-0 bg-slate-900/60 modal-blur z-50 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl border border-slate-100">
            <div class="bg-slate-800 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i>
                    <span>資料管理與備份</span>
                </h3>
                <button onclick="closeModal('backupModal')" class="text-slate-400 hover:text-white text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h4 class="font-bold text-slate-700 text-sm mb-1">匯出資料 JSON</h4>
                    <p class="text-xs text-slate-500 mb-3">將現有的課程資源與勾選紀錄下載備份。</p>
                    <button onclick="exportData()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2">
                        <i class="fa-solid fa-download"></i> 匯出 JSON 備份檔
                    </button>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h4 class="font-bold text-slate-700 text-sm mb-1">匯入資料 JSON</h4>
                    <p class="text-xs text-slate-500 mb-3">選擇備份檔案以覆蓋現有資源清單。</p>
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
                    <button onclick="document.getElementById('importFile').click()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2">
                        <i class="fa-solid fa-upload"></i> 選擇 JSON 檔案匯入
                    </button>
                </div>

                <div class="bg-rose-50 p-4 rounded-xl border border-rose-200">
                    <h4 class="font-bold text-rose-700 text-sm mb-1">強制重設預設資料 (包含最新 U1-U4)</h4>
                    <p class="text-xs text-rose-600/80 mb-3">若需要重設所有練習項目，點擊此按鈕即可還原。</p>
                    <button onclick="resetToDefaultData()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2">
                        <i class="fa-solid fa-rotate-left"></i> 重設預設資料
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript 核心邏輯 -->
    <script>
        const DEFAULT_RESOURCES = [
            // Unit 1
            { id: 'u1-1', unit: 'U1', title: '聽音選字', url: 'https://wordwall.net/tc/resource/61030639?wwmethod=link', completed: false },
            { id: 'u1-2', unit: 'U1', title: '單字配對', url: 'https://wordwall.net/tc/resource/60234337?wwmethod=link', completed: false },
            { id: 'u1-3', unit: 'U1', title: '聽音排字', url: 'https://wordwall.net/tc/resource/60648383?wwmethod=link', completed: false },
            { id: 'u1-4', unit: 'U1', title: '聽懂意思', url: 'https://wordwall.net/tc/resource/60656592?wwmethod=link', completed: false },
            { id: 'u1-5', unit: 'U1', title: '天氣播報', url: 'https://wordwall.net/tc/resource/33457766?wwmethod=link', completed: false },

            // Unit 2
            { id: 'u2-1', unit: 'U2', title: '排列句子', url: 'https://wordwall.net/tc/resource/78918902?wwmethod=link', completed: false },
            { id: 'u2-2', unit: 'U2', title: '拼字遊戲', url: 'https://wordwall.net/tc/resource/85703324?wwmethod=link', completed: false },
            { id: 'u2-3', unit: 'U2', title: '眼明手快', url: 'https://wordwall.net/tc/resource/56066174?wwmethod=link', completed: false },

            // Unit 3
            { id: 'u3-1', unit: 'U3', title: '看圖排單字', url: 'https://wordwall.net/tc/resource/62947016?wwmethod=link', completed: false },
            { id: 'u3-2', unit: 'U3', title: '句型重組', url: 'https://wordwall.net/tc/resource/57669292?wwmethod=link', completed: false },
            { id: 'u3-3', unit: 'U3', title: '句型練習', url: 'https://wordwall.net/tc/resource/64389402?wwmethod=link', completed: false },
            { id: 'u3-4', unit: 'U3', title: '拼字遊戲', url: 'https://wordwall.net/tc/resource/62348835?wwmethod=link', completed: false },

            // Unit 4
            { id: 'u4-1', unit: 'U4', title: '拼字練習', url: 'https://wordwall.net/tc/resource/57207543?wwmethod=link', completed: false },
            { id: 'u4-2', unit: 'U4', title: '看圖重組單字', url: 'https://wordwall.net/tc/resource/64957091?wwmethod=link', completed: false },
            { id: 'u4-3', unit: 'U4', title: '單元練習 (3)', url: 'https://wordwall.net/tc/resource/65563634?wwmethod=link', completed: false },
            { id: 'u4-4', unit: 'U4', title: '單字練習', url: 'https://wordwall.net/tc/resource/85702717?wwmethod=link', completed: false },
            { id: 'u4-5', unit: 'U4', title: '迷宮追逐', url: 'https://wordwall.net/tc/resource/65436159?wwmethod=link', completed: false },
            { id: 'u4-6', unit: 'U4', title: '問答遊戲', url: 'https://wordwall.net/tc/resource/65190817?wwmethod=link', completed: false }
        ];

        const STORAGE_KEY = 'wordwall_here_we_go_5_v9';

        let resources = [];
        let currentActiveUnit = 'ALL';

        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderUnitTabs();
            renderCards();
        });

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    const existingIds = new Set(parsed.map(item => item.id));
                    let hasMissing = false;

                    DEFAULT_RESOURCES.forEach(defItem => {
                        if (!existingIds.has(defItem.id)) {
                            parsed.push({...defItem});
                            hasMissing = true;
                        }
                    });

                    resources = parsed;
                    if (hasMissing) saveData();
                } catch(e) {
                    resources = [...DEFAULT_RESOURCES];
                    saveData();
                }
            } else {
                resources = JSON.parse(JSON.stringify(DEFAULT_RESOURCES));
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(resources));
            updateCounters();
        }

        function resetToDefaultData() {
            if (confirm('確定要還原為包含最新預設資料嗎？')) {
                resources = JSON.parse(JSON.stringify(DEFAULT_RESOURCES));
                saveData();
                renderUnitTabs();
                renderCards();
                closeModal('backupModal');
            }
        }

        function getUniqueUnits() {
            const units = Array.from(new Set(resources.map(r => r.unit)));
            return units.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
        }

        function renderUnitTabs() {
            const tabsContainer = document.getElementById('unitTabs');
            const units = getUniqueUnits();

            let html = `
                <button onclick="switchUnit('ALL')" class="px-4 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition ${currentActiveUnit === 'ALL' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                    全部顯示
                </button>
            `;

            units.forEach(unit => {
                const isActive = currentActiveUnit === unit;
                html += `
                    <button onclick="switchUnit('${unit}')" class="px-4 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition ${isActive ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                        ${unit}
                    </button>
                `;
            });

            tabsContainer.innerHTML = html;
        }

        function switchUnit(unit) {
            currentActiveUnit = unit;
            renderUnitTabs();
            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('unitSectionsContainer');
            const emptyState = document.getElementById('emptyState');
            const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();

            const allUnits = getUniqueUnits();
            const filteredUnits = allUnits.filter(unit => currentActiveUnit === 'ALL' || unit === currentActiveUnit);

            let hasAnyContent = false;
            let sectionsHtml = '';

            filteredUnits.forEach(unit => {
                const unitItems = resources.filter(item => {
                    const matchUnit = item.unit === unit;
                    const matchSearch = item.title.toLowerCase().includes(searchKeyword) || item.unit.toLowerCase().includes(searchKeyword);
                    return matchUnit && matchSearch;
                });

                if (unitItems.length > 0) {
                    hasAnyContent = true;
                    
                    const cardsHtml = unitItems.map(item => `
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all flex flex-col justify-between overflow-hidden group ${item.completed ? 'bg-emerald-50/40 border-emerald-200' : ''}">
                            <div class="p-5">
                                <div class="flex justify-between items-start gap-2 mb-3">
                                    <span class="bg-indigo-100 text-indigo-700 font-black text-xs px-3 py-1 rounded-lg">
                                        ${item.unit}
                                    </span>
                                    <label class="flex items-center gap-1.5 cursor-pointer select-none text-xs text-slate-500 hover:text-slate-700">
                                        <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleComplete('${item.id}')" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                                        <span>${item.completed ? '已完成' : '未完成'}</span>
                                    </label>
                                </div>

                                <h3 class="font-bold text-slate-800 text-base sm:text-lg group-hover:text-indigo-600 transition mb-2">
                                    ${item.title}
                                </h3>
                                <p class="text-xs text-slate-400 truncate">
                                    <i class="fa-solid fa-link text-slate-300 mr-1"></i>${item.url}
                                </p>
                            </div>

                            <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100 flex items-center">
                                <a href="${item.url}" target="_blank" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs sm:text-sm flex items-center justify-center gap-2 btn-push transition">
                                    <i class="fa-solid fa-circle-play"></i>
                                    <span>立即練習 (新分頁)</span>
                                </a>
                            </div>
                        </div>
                    `).join('');

                    sectionsHtml += `
                        <section class="bg-slate-50/60 p-5 sm:p-6 rounded-3xl border border-slate-200/80">
                            <div class="flex items-center gap-3 mb-4 pb-2 border-b border-slate-200">
                                <div class="bg-indigo-600 text-white px-4 py-1.5 rounded-xl font-black text-base tracking-wide shadow-sm">
                                    ${unit}
                                </div>
                                <h2 class="font-bold text-slate-700 text-lg sm:text-xl">
                                    ${getUnitDisplayName(unit)} 練習資源
                                </h2>
                                <span class="text-xs text-slate-400 font-medium">(${unitItems.length} 個項目)</span>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                                ${cardsHtml}
                            </div>
                        </section>
                    `;
                }
            });

            if (!hasAnyContent) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                container.innerHTML = sectionsHtml;
            }

            updateCounters();
        }

        function getUnitDisplayName(unit) {
            switch(unit.toUpperCase()) {
                case 'U1': return 'Unit 1';
                case 'U2': return 'Unit 2';
                case 'U3': return 'Unit 3';
                case 'U4': return 'Unit 4';
                default: return unit;
            }
        }

        function updateCounters() {
            document.getElementById('totalCount').innerText = resources.length;
            document.getElementById('completedCount').innerText = resources.filter(r => r.completed).length;
        }

        function toggleComplete(id) {
            const item = resources.find(r => r.id === id);
            if (item) {
                item.completed = !item.completed;
                saveData();
                renderCards();
            }
        }

        function handleAddResource(e) {
            e.preventDefault();
            const unit = document.getElementById('addUnit').value.trim();
            const title = document.getElementById('addTitle').value.trim();
            const url = document.getElementById('addUrl').value.trim();

            if (!unit || !title || !url) return;

            const newItem = {
                id: 'custom-' + Date.now(),
                unit: unit.toUpperCase(),
                title: title,
                url: url,
                completed: false
            };

            resources.unshift(newItem);
            saveData();
            renderUnitTabs();
            renderCards();

            document.getElementById('addUnit').value = '';
            document.getElementById('addTitle').value = '';
            document.getElementById('addUrl').value = '';
            closeModal('addModal');
        }

        function filterCards() {
            renderCards();
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(resources, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `HereWeGo5_Wordwall_Backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        resources = imported;
                        saveData();
                        renderUnitTabs();
                        renderCards();
                        alert('資料匯入成功！');
                        closeModal('backupModal');
                    } else {
                        alert('匯入的檔案格式不正確');
                    }
                } catch (err) {
                    alert('讀取檔案失敗：請確認是否為標準 JSON 格式');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
